services:
  postgres:
    image: postgres:16-alpine
    container_name: gen_ai_mcp_lab_postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: mcp_lab
      POSTGRES_USER: mcp_user
      POSTGRES_PASSWORD: mcp_password
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./db/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U mcp_user -d mcp_lab"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres_data: